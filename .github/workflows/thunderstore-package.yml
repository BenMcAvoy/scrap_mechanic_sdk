name: Build Thunderstore package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out repository and memorylib submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Build release SDK
        shell: pwsh
        run: |
          xmake f -y -p windows -a x64 -m release
          xmake b -r -y scrap_mechanic_sdk

      - name: Build Thunderstore zip
        run: python scripts/package_thunderstore.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrapMechanicSDK-${{ github.sha }}
          path: artifacts/ScrapMechanicSDK-*.zip
          if-no-files-found: error
